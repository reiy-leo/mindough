# 打原生安装包：macOS（universal）、Windows（msi / nsis）、Linux（AppImage / deb）未签名；Android 是用固定钥匙签名的 release APK（docs/ANDROID-RELEASE.md）。
# 手动触发，或推 v* 标签；版本号按标签填（scripts/app-version.mjs：macOS「0.1.0 (13)」、msi 0.1.0.13、APK 0.1.0-alpha.13），手动触发是 0.1.0-dev+短哈希；产物上传为 Actions artifacts，推标签时另建 Release 草稿（alpha 也建，预发布），APK 一并挂上，同时发到自建 F-Droid 源 https://fdroid.rei8t.dev/repo；iOS 见 ios.yml（手动）。
name: Build apps

on:
  workflow_dispatch:
    inputs:
      fdroid_test:
        description: 把这次的 APK 发到 F-Droid 源的试跑目录 _test/（不动正式源）
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  desktop:
    name: 桌面 ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS（universal）
            os: macos-latest
            platform: macos
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: mindough-macos
            bundle: apps/client/src-tauri/target/universal-apple-darwin/release/bundle
          - name: Windows
            os: windows-latest
            platform: windows
            args: ''
            rust-targets: ''
            artifact: mindough-windows
            bundle: apps/client/src-tauri/target/release/bundle
          - name: Linux
            os: ubuntu-22.04
            platform: linux
            args: ''
            rust-targets: ''
            artifact: mindough-linux
            bundle: apps/client/src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux 依赖（WebKitGTK 等）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev xdg-utils

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # 按标签填版本（scripts/app-version.mjs）：合进 tauri.<平台>.conf.json，Tauri 和 tauri-action 都会读；
      # 前端的完整版本（v0.1.0-alpha.13 / v0.1.0-dev+短哈希）写进 MINDOUGH_VERSION
      - name: 版本号
        shell: bash
        run: node scripts/app-version.mjs apply ${{ matrix.platform }}

      - name: 打包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/client
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          # 只有推标签时才建 Release 草稿；手动触发只出 artifacts
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Mindough ${{ github.ref_name }}
          releaseDraft: true
          prerelease: true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            ${{ matrix.bundle }}/dmg/*.dmg
            ${{ matrix.bundle }}/macos/*.app.tar.gz
            ${{ matrix.bundle }}/msi/*.msi
            ${{ matrix.bundle }}/nsis/*.exe
            ${{ matrix.bundle }}/appimage/*.AppImage
            ${{ matrix.bundle }}/deb/*.deb

  android:
    name: Android（release APK）
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
      # 签名证书的 SHA-256（公开信息）。签完核对一遍，secrets 里的钥匙被换掉就失败，免得用户装不上更新
      ANDROID_CERT_SHA256: 1f4651b3bebffbd4ea2ddf047f3784519c0e2137b53648035928514a02b579b7
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # setup-android 默认装 "tools" 包；新 runner 镜像（cmdline-tools 16.0）已没有这个包，sdkmanager 退出码 1，
      # 所以只装 platform-tools（Rei 2026-10-17 alpha.2 的 Android 任务因此失败）
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: 安装 NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # gen/ 不进仓库（.gitignore），CI 里现生成 Android 工程
      - name: tauri android init
        working-directory: apps/client
        run: |
          if [ ! -d src-tauri/gen/android ]; then pnpm tauri android init --ci; fi

      # init 只拷 Tauri 默认图标（alpha.14 桌面图标还是 Tauri 的），换成 icons/android 里的念头团图标，sha256 不一致就失败
      - name: 换上念头团图标
        run: scripts/native-icons.sh android

      # 中文系统下显示「念头团」（values-zh / values-zh-rCN），其他语言（es、pt-rBR、ru、ja、de、fr、in）和默认都是 Mindough
      - name: 本地化显示名
        run: scripts/native-locales.sh android

      # 关掉 WebView 双指缩放（Rei 2026-11-05）：MainActivity 是 init 现生成的，加 onWebViewCreate
      - name: WebView 不能缩放
        run: scripts/android-webview.sh

      # versionName 带预发布标签（0.1.0-alpha.13），versionCode 随 alpha 递增（scripts/app-version.mjs）
      - name: 版本号
        run: node scripts/app-version.mjs apply android

      # 只打 arm64：2019 年以后的 Android 手机基本都是 64 位，加 armv7 包会大一截、多编一遍
      - name: 打 release APK（arm64）
        working-directory: apps/client
        run: pnpm tauri android build --apk --target aarch64

      # Gradle 出的是未签名包，用 secrets 里的钥匙签（zipalign → apksigner，v2/v3 签名），再核证书指纹
      - name: 签名
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$ANDROID_KEYSTORE_B64" ] || { echo "缺 secrets.ANDROID_KEYSTORE_B64"; exit 1; }
          bt="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          unsigned=$(find apps/client/src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -1)
          [ -n "$unsigned" ] || { echo "没找到未签名的 release APK"; find apps/client/src-tauri/gen/android/app/build/outputs/apk; exit 1; }
          ks="$RUNNER_TEMP/release.p12"
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$ks"
          mkdir -p out
          out="out/Mindough-${MINDOUGH_VERSION}-android-arm64.apk"
          "$bt/zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign --ks "$ks" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$out" "$RUNNER_TEMP/aligned.apk"
          rm -f "$ks"
          "$bt/apksigner" verify --print-certs "$out" | tee "$RUNNER_TEMP/certs.txt"
          grep -qi "SHA-256 digest: $ANDROID_CERT_SHA256" "$RUNNER_TEMP/certs.txt" || { echo "签名证书指纹不对"; exit 1; }

      # 构建后再核一遍：res 里的图标没被改回去，APK 里有自适应图标
      - name: 核对图标
        run: |
          scripts/native-icons.sh android verify
          scripts/android-webview.sh verify
          apk=$(find out -name '*.apk' | head -1)
          unzip -l "$apk" | grep -E 'mipmap-(anydpi|xxxhdpi)' || { echo "APK 里没找到 mipmap 图标"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: mindough-android-release
          if-no-files-found: error
          path: out/*.apk

  # 推标签时，把 APK 也挂到桌面端建好的 Release 草稿上（alpha 也建 Release，Rei 2026-10-17 定）
  release-android:
    name: APK 挂到 Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mindough-android-release
          path: apk
      - name: 上传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          f=$(find apk -name '*.apk' | head -1)
          gh release upload "$GITHUB_REF_NAME" "$f" --clobber -R "$GITHUB_REPOSITORY"
      # Release 说明直接用附注标签的说明（打标签时写好改动列表）；轻量标签没有说明，就不动
      - name: Release 说明
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
          if [ "$(echo "$ref" | jq -r .object.type)" = "tag" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$(echo "$ref" | jq -r .object.sha)" --jq .message > notes.md
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md -R "$GITHUB_REPOSITORY"
          fi

  # 发到自建 F-Droid 源（docs/ANDROID-RELEASE.md）：推标签时发正式源；手动触发勾了 fdroid_test 就发到试跑目录 _test/
  fdroid:
    name: 发到 F-Droid 源
    if: startsWith(github.ref, 'refs/tags/') || inputs.fdroid_test
    needs: [android]
    runs-on: ubuntu-latest
    concurrency: fdroid-repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: mindough-android-release
          path: apk
      # fdroidserver 用 pip 装最新版：Ubuntu 源里的 2.2.1 带的 androguard 太旧，解析新版 AGP 打的 resources.arsc 会报错
      - name: 装 fdroidserver
        run: |
          python3 -m venv "$RUNNER_TEMP/fd"
          "$RUNNER_TEMP/fd/bin/pip" install -q fdroidserver
          echo "$RUNNER_TEMP/fd/bin" >> "$GITHUB_PATH"
          echo "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)" >> "$GITHUB_PATH"
      - name: fdroid update 并上传
        env:
          FDROID_KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_B64 }}
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
          FDROID_UPLOAD_TOKEN: ${{ secrets.FDROID_UPLOAD_TOKEN }}
          FDROID_PREFIX: ${{ startsWith(github.ref, 'refs/tags/') && '' || '_test/' }}
        run: scripts/fdroid/publish.sh apk/*.apk
